spring.application.name=mymanga

spring.config.import=optional:file:./.env
jwt.public.key=classpath:app.pub
jwt.private.key=classpath:app.key

server.servlet.context-path=/my-manga

app.admin.password=${ADMIN_PASSWORD:admin123}
app.test-user.password=${TEST_USER_PASSWORD:teste123}
app.jwt.expires-in=${JWT_EXPIRES_IN:1800}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
app.api-url=${API_URL:http://localhost:8080/my-manga}
