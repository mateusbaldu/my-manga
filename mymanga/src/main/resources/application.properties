spring.application.name=mymanga

spring.config.import=optional:file:./.env

# Server
server.port=${PORT:8080}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/my-manga}
server.error.include-stacktrace=${SERVER_ERROR_INCLUDE_STACKTRACE:never}

# Database (Neon PostgreSQL / Local Fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/banco_manga}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.jpa.defer-datasource-initialization=${SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION:true}

# JWT
jwt.public.key=${JWT_PUBLIC_KEY:classpath:app.pub}
jwt.private.key=${JWT_PRIVATE_KEY:classpath:app.key}
app.jwt.issuer=${JWT_ISSUER:my-mangá.api}
app.jwt.expires-in=${JWT_EXPIRES_IN:1800}

# Redis & Cache (Render Key Value / Upstash / Local Fallback)
spring.cache.type=${SPRING_CACHE_TYPE:redis}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:5000ms}
app.cache.ttl-minutes=${CACHE_TTL_MINUTES:180}

# Rate Limit
app.rate-limit.tokens=${RATE_LIMIT_TOKENS:20}
app.rate-limit.refill-minutes=${RATE_LIMIT_REFILL_MINUTES:1}

# Mail / SMTP
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:noreply@mymanga.com}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

# Frontend & CORS URLs
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:4200}}
app.api-url=${API_URL:http://localhost:8080/my-manga}
